services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finmate
      # Local development only; never reuse these credentials in a shared environment.
      POSTGRES_PASSWORD: finmate
      POSTGRES_DB: finmate
    ports:
      # 5433 avoids conflict with a local PostgreSQL install on Windows (default 5432)
      - "127.0.0.1:5433:5432"
    volumes:
      - finmate_pg:/var/lib/postgresql/data

volumes:
  finmate_pg:
