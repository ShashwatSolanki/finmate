name: FinMate CI

concurrency:
  group: finmate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main, deploy/free-staging-setup]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      EMAIL_MOCK_MODE: "true"
      AUTH_ALLOW_MOCK_GOOGLE: "true"
      JWT_SECRET: "ci-only-test-secret-not-for-production-0123456789abcdef"
      DATABASE_URL: "sqlite:///./ci.db"
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-staging.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Audit staging Python dependencies
        run: pip-audit -r requirements-staging.txt

      - name: Run backend test suite
        run: pytest -q

      - name: Run research evaluation harness tests
        run: python -m unittest discover -s ../research/evaluation -p 'test_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit all frontend dependencies, including build tools
        run: npm audit --audit-level=high
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
